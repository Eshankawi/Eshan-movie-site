<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eshan Movie Site</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

  <style>
    #iframe-section iframe {
      width: 100%;
      height: calc(100vh - 150px);
    }

    .popup-bg {
      background-color: rgba(0, 0, 0, 0.7);
    }

    .fade {
      transition: all 0.3s ease-in-out;
    }

    .hidden {
      display: none !important;
    }

    body {
      background: #000;
      font-family: sans-serif;
    }

    .glow-box {
      border: 2px solid transparent;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      padding: 2px;
    }

    .glow-box::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, #00f0ff, #ff00f7, #00ff6a, #ffe600, #ff0055);
      animation: rotate 4s linear infinite;
      z-index: 0;
      filter: blur(20px);
    }

    .glow-box > .inner {
      position: relative;
      background: #111;
      border-radius: 16px;
      z-index: 1;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen relative">

  <!-- Welcome Section With Glow -->
  <div id="welcome-section" class="flex flex-col items-center justify-center min-h-screen p-4 fade">
    <div class="glow-box max-w-md w-full">
      <div class="inner text-white p-6 text-center space-y-4">

        <h1 class="text-4xl font-extrabold">Welcome to Eshan Movie Site</h1>
        <p class="text-lg">Watch movies and series in high quality, free of ads!</p>

        <button 
          onclick="showIframe()"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded shadow">
          Explore Now
        </button>

        <div id="user-info" class="text-left mt-6">
          <h2 class="text-lg font-bold mb-2">User Information</h2>
          <div id="ip-address">Loading IP address...</div>
          <div id="time">Time:</div>
          <div id="date">Date:</div>
          <div id="battery">Battery:</div>
        </div>

      </div>
    </div>
  </div>

  <!-- Iframe Section -->
  <div id="iframe-section" class="hidden fade">
    <header class="bg-gray-900 py-4 text-center text-xl font-bold">
      Eshan©CineSubz Movie Site
    </header>

    <div class="bg-gray-800 px-4 py-2 flex items-center justify-between flex-wrap gap-2">
      <div>
        <button onclick="goBack()" class="bg-red-600 px-4 py-1 rounded text-sm hover:bg-red-700">
          ← Back to Home
        </button>
      </div>
      <div class="flex flex-wrap gap-2 justify-end">
        <a href="https://eshan-movie-site.vercel.app/" target="_blank" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm">
          CineSubz
        </a>
        <a href="https://sinhalasub.lk/" target="_blank" class="bg-yellow-500 hover:bg-yellow-600 text-black px-3 py-1 rounded text-sm">
          SinhalaSub
        </a>
        <a href="https://pirate.lk/" target="_blank" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm">
          Pirate
        </a>
        <a href="https://cineru.lk/" target="_blank" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-sm">
          Cineru
        </a>
      </div>
    </div>

    <iframe src="https://cinesubz.co/movies/" frameborder="0"></iframe>
  </div>

  <!-- WhatsApp Floating Button -->
  <button onclick="togglePopup()" 
          class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-full shadow-lg z-50">
    Chat
  </button>

  <!-- WhatsApp Popup -->
  <div id="popup" class="hidden fixed inset-0 flex items-center justify-center popup-bg z-50">
    <div class="bg-white text-black p-6 rounded-lg shadow-lg w-80 text-center">
      <h2 class="text-xl font-bold mb-4">Select WhatsApp Number</h2>
      <button onclick="openWhatsApp('94789119916')" class="block w-full bg-green-500 text-white py-2 rounded my-2 hover:bg-green-600">
        +94 78 911 9916
      </button>
      <button onclick="openWhatsApp('94758178340')" class="block w-full bg-green-500 text-white py-2 rounded my-2 hover:bg-green-600">
        +94 75 817 8340
      </button>
      <button onclick="togglePopup()" class="text-sm text-red-500 mt-3 hover:underline">Cancel</button>
    </div>
  </div>

  <script>
    function showIframe() {
      document.getElementById("welcome-section").classList.add("hidden");
      document.getElementById("iframe-section").classList.remove("hidden");
      document.getElementById("user-info").classList.add("hidden");
    }

    function goBack() {
      document.getElementById("iframe-section").classList.add("hidden");
      document.getElementById("welcome-section").classList.remove("hidden");
      document.getElementById("user-info").classList.remove("hidden");
    }

    function togglePopup() {
      document.getElementById("popup").classList.toggle("hidden");
    }

    function openWhatsApp(number) {
      window.open(`https://wa.me/${number}`, "_blank");
      togglePopup();
    }

    // IP Address
    fetch('https://ipinfo.io/json?token=e7dda0961e4af2')
      .then(response => response.json())
      .then(data => {
        document.getElementById('ip-address').textContent = `IP Address: ${data.ip}`;
      })
      .catch(error => {
        document.getElementById('ip-address').textContent = 'IP Address: N/A';
      });

    // Time & Date
    function updateTime() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      const timeString = `${hours}:${minutes}:${seconds}`;
      const dateString = now.toLocaleDateString();

      document.getElementById('time').textContent = `Time: ${timeString}`;
      document.getElementById('date').textContent = `Date: ${dateString}`;
    }

    setInterval(updateTime, 1000);

    // Battery Info
    function updateBatteryInfo() {
      if (navigator.getBattery) {
        navigator.getBattery().then(function(battery) {
          function displayBatteryStatus() {
            const batteryLevel = Math.round(battery.level * 100);
            const chargingStatus = battery.charging ? 'Charging' : 'Not Charging';
            document.getElementById('battery').textContent = `Battery: ${batteryLevel}% (${chargingStatus})`;
          }

          displayBatteryStatus();
          battery.addEventListener('chargingchange', displayBatteryStatus);
          battery.addEventListener('levelchange', displayBatteryStatus);
        });
      } else {
        document.getElementById('battery').textContent = 'Battery: N/A';
      }
    }

    updateBatteryInfo();
  </script>

</body>
</html>
